<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERROR 404 — DIRECTIVE NOT FOUND</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --surface-base: #141313;
      --accent-glare: #ff5540;
      --text-primary: #e6e1e1;
      --font-mono: 'Space Mono', monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--surface-base);
      color: var(--text-primary);
      font-family: var(--font-mono);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      cursor: none;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: -2;
      background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: -1;
      background-image: radial-gradient(rgba(255, 40, 40, 0.45) 1px, transparent 1px);
      background-size: 24px 24px;
      -webkit-mask-image: radial-gradient(circle at var(--mouse-x, -1000px) var(--mouse-y, -1000px), black 0%, transparent 150px);
      mask-image: radial-gradient(circle at var(--mouse-x, -1000px) var(--mouse-y, -1000px), black 0%, transparent 150px);
    }

    /* CUSTOM CURSOR (HOVER ONLY) */
    .custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
    }

    .custom-cursor.hover-glitch {
      background: none;
    }

    .custom-cursor.hover-glitch::before {
      content: '[  ]';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 700;
      color: var(--accent-glare);
      white-space: pre;
      animation: cursorGlitch 0.2s infinite alternate;
    }

    @keyframes cursorGlitch {
      0% {
        transform: translate(-50%, -50%) skewX(0deg);
      }

      20% {
        transform: translate(-52%, -50%) skewX(10deg);
      }

      40% {
        transform: translate(-50%, -48%) skewX(-10deg);
      }

      60% {
        transform: translate(-48%, -52%) skewX(5deg);
      }

      80% {
        transform: translate(-50%, -50%) skewX(-5deg);
      }

      100% {
        transform: translate(-50%, -50%) skewX(0deg);
      }
    }

    #cursor-canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
    }

    .error-container {
      max-width: 600px;
      padding: 40px;
      border: 1px solid #393939;
      position: relative;
    }

    .error-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 10px;
      height: 10px;
      border-top: 2px solid var(--accent-glare);
      border-left: 2px solid var(--accent-glare);
    }

    .error-container::after {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      width: 10px;
      height: 10px;
      border-bottom: 2px solid var(--accent-glare);
      border-right: 2px solid var(--accent-glare);
    }

    .status-code {
      font-size: 80px;
      color: var(--accent-glare);
      margin-bottom: 10px;
      letter-spacing: -2px;
      font-weight: 700;
      animation: textGlitch 2s infinite;
    }

    .error-msg {
      font-size: 18px;
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .sys-log {
      color: #8e9192;
      font-size: 12px;
      margin-bottom: 40px;
      line-height: 1.8;
    }

    .return-btn {
      display: inline-block;
      padding: 12px 24px;
      background: transparent;
      color: var(--text-primary);
      border: 1px solid #393939;
      text-decoration: none;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .return-btn:hover {
      border-color: var(--accent-glare);
      color: var(--accent-glare);
    }

    @keyframes textGlitch {

      0%,
      100% {
        transform: none;
        opacity: 1;
      }

      5% {
        transform: skewX(5deg);
        opacity: 0.8;
      }

      10% {
        transform: skewX(-5deg);
        opacity: 0.8;
      }

      15% {
        transform: none;
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <canvas id="cursor-canvas" width="120" height="120"></canvas>
  <div class="custom-cursor" id="custom-cursor"></div>

  <div class="error-container">
    <div class="status-code">404</div>
    <div class="error-msg">ERROR: DIRECTIVE NOT FOUND</div>
    <div class="sys-log">
      > ATTEMPTING TO RESOLVE PATH... [FAILED]<br>
      > QUERYING ROOT DIRECTORY... [FAILED]<br>
      > TARGET SECTOR CORRUPTED OR UNAVAILABLE.<br>
      > AWAITING USER INPUT.
    </div>
    <a href="index.html" class="return-btn">RETURN TO ROOT ▷</a>
  </div>

  <script>
    const customCursor = document.getElementById('custom-cursor');
    const interactiveElements = document.querySelectorAll('a, button');

    document.addEventListener('mousemove', (e) => {
      customCursor.style.left = e.clientX + 'px';
      customCursor.style.top = e.clientY + 'px';
    });

    // ══════════════════════════════════════════════════════════════
    // BLACK HOLE CURSOR LOGIC (GARGANTUA)
    // ══════════════════════════════════════════════════════════════
    const cursorCanvas = document.getElementById('cursor-canvas');
    const ctx = cursorCanvas.getContext('2d');
    let mouseX = -1000;
    let mouseY = -1000;

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursorCanvas.style.left = mouseX + 'px';
      cursorCanvas.style.top = mouseY + 'px';
      document.body.style.setProperty('--mouse-x', mouseX + 'px');
      document.body.style.setProperty('--mouse-y', mouseY + 'px');
    });

    let time = 0;
    let targetAngle = 0;
    let currentAngle = 0;
    let prevMouseX = -1000;
    let prevMouseY = -1000;

    function drawCursor() {
      ctx.clearRect(0, 0, 120, 120);
      time += 0.03;

      // Calculate rotation based on movement
      const dx = mouseX - prevMouseX;
      const dy = mouseY - prevMouseY;
      
      // Update target angle only if moving to prevent snapping back
      if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
        targetAngle = Math.atan2(dy, dx);
      }
      
      // Smooth interpolation for the angle
      let diff = targetAngle - currentAngle;
      while (diff < -Math.PI) diff += Math.PI * 2;
      while (diff > Math.PI) diff -= Math.PI * 2;
      currentAngle += diff * 0.15;
      
      prevMouseX = mouseX;
      prevMouseY = mouseY;

      const cx = 60;
      const cy = 60;
      const r = 16; 
      
      ctx.save();
      // Apply rotation around the center
      ctx.translate(cx, cy);
      ctx.rotate(currentAngle);
      ctx.translate(-cx, -cy);

      // 1. Back of the Accretion Disk (Behind Black Hole)
      ctx.setLineDash([12, 8, 25, 10, 5, 10]);
      ctx.lineDashOffset = -time * 30;
      ctx.beginPath();
      // start: PI, end: 2*PI (top half of ellipse)
      ctx.ellipse(cx, cy, 48, 12, 0, Math.PI, Math.PI * 2);
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(220, 30, 30, 0.5)';
      ctx.shadowBlur = 10;
      ctx.shadowColor = 'rgba(180, 0, 0, 0.8)';
      ctx.stroke();
      
      // 2. Gravitational Lensing (Photon Ring wrapping around)
      ctx.setLineDash([15, 10, 30, 15, 8, 12]);
      ctx.lineDashOffset = time * 20; 
      ctx.beginPath();
      ctx.arc(cx, cy, r + 3, 0, Math.PI * 2);
      ctx.lineWidth = 4;
      
      const grad = ctx.createLinearGradient(cx, cy - r - 5, cx, cy + r + 5);
      grad.addColorStop(0, 'rgba(255, 80, 80, 1)'); 
      grad.addColorStop(0.5, 'rgba(150, 0, 0, 0.2)'); 
      grad.addColorStop(1, 'rgba(255, 30, 30, 0.8)'); 
      
      ctx.strokeStyle = grad;
      ctx.shadowBlur = 15;
      ctx.shadowColor = 'rgba(200, 0, 0, 1)';
      ctx.stroke();
      
      // 3. The Event Horizon (The Black Void)
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = '#000000';
      ctx.shadowBlur = 0; 
      ctx.fill();
      
      // Subtle rim light inside the void to give it spherical volume
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(200, 0, 0, 0.3)';
      ctx.stroke();
      
      // 4. Front of the Accretion Disk (In front of Black Hole)
      ctx.setLineDash([12, 8, 25, 10, 5, 10]);
      ctx.lineDashOffset = -time * 30;
      ctx.beginPath();
      // start: 0, end: PI (bottom half of ellipse)
      ctx.ellipse(cx, cy, 48, 12, 0, 0, Math.PI);
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(255, 100, 100, 1)';
      ctx.shadowBlur = 20;
      ctx.shadowColor = 'rgba(255, 0, 0, 1)';
      ctx.stroke();
      
      // Inner bright core of the front disk
      ctx.setLineDash([8, 12, 20, 15]);
      ctx.lineDashOffset = -time * 40;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 48, 12, 0, 0, Math.PI);
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = 'rgba(255, 200, 200, 1)';
      ctx.shadowBlur = 5;
      ctx.stroke();
      
      ctx.setLineDash([]);
      
      ctx.restore();
      requestAnimationFrame(drawCursor);
    }

    drawCursor();

    interactiveElements.forEach(el => {
      el.addEventListener('mouseenter', () => {
        cursorCanvas.style.display = 'none';
        customCursor.classList.add('hover-glitch');
      });
      el.addEventListener('mouseleave', () => {
        cursorCanvas.style.display = 'block';
        customCursor.classList.remove('hover-glitch');
      });
    });
  </script>
</body>

</html>
