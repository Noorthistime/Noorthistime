<style>
/* ══════════════════════════════════════════════════════════════
   PHASE 1: MONOLITH NOIR - FOUNDATION & CSS ARCHITECTURE
   ══════════════════════════════════════════════════════════════ */
:root {
  /* Colors */
  --surface-base: #131313;
  --surface-container: #1C1B1B;
  --surface-bright: #3a3939;
  --accent-glare: #FF0000;
  --border-color: #393939;
  
  --text-primary: #e6e1e1;
  --text-secondary: #c4c7c7;
  --text-inverse: #313030;
  
  --glass-overlay: rgba(28, 27, 27, 0.8);
  
  /* Typography */
  --font-mono: 'Space Mono', monospace;
  --font-body: 'Inter', sans-serif;
  
  /* Layout */
  --grid-base: 4px;
  --radius: 0px; /* Strict Brutalism */
}

/* Reset & Base */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--surface-base);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* Typography Scale */
h1, h2, h3, h4, h5, h6, .mono-head {
  font-family: var(--font-mono);
  text-transform: uppercase;
  font-weight: 700;
}
.display-lg { font-size: clamp(32px, 5vw, 48px); line-height: 1.1; letter-spacing: -0.02em; }
.headline-lg { font-size: clamp(24px, 4vw, 32px); line-height: 1.2; letter-spacing: 0.05em; }
.headline-md { font-size: 24px; line-height: 1.2; letter-spacing: 0.05em; }
.headline-sm { font-size: 18px; line-height: 1.4; letter-spacing: 0.1em; }
.label-md { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; }

/* Brutalist Utilities */
a { color: inherit; text-decoration: none; }
ul { list-style: none; }
.sharp { border-radius: var(--radius) !important; }
.border-grid { border: 1px solid var(--border-color); }

/* ══════════════════════════════════════════════════════════════
   PHASE 2: GLOBAL LAYOUT & NAVIGATION
   ══════════════════════════════════════════════════════════════ */
.container {
  width: 100%;
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 64px;
}
@media (max-width: 1024px) { .container { padding: 0 32px; } }
@media (max-width: 768px) { .container { padding: 0 16px; } }

.section-divider {
  border-top: 1px solid var(--border-color);
  width: 100%;
}
.dot-matrix-bg {
  background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
  background-size: 8px 8px;
}

/* Nav */
#nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 60px;
  background: var(--glass-overlay);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-color);
  z-index: 900;
}
.nav-inner {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.nav-logo {
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.nav-logo span { color: var(--accent-glare); }
.nav-links { display: flex; gap: 32px; }
.nav-links a {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-secondary);
  transition: color 0.2s ease, text-shadow 0.2s ease;
}
.nav-links a:hover {
  color: var(--accent-glare);
  text-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
}
@media (max-width: 768px) { .nav-links { display: none; } }
</style>
</head>
<body>
  <!-- NAV -->
  <nav id="nav">
    <div class="container nav-inner">
      <a href="#hero" class="nav-logo">Saiyed<span>.</span></a>
      <div class="nav-links">
        <a href="#about">About</a>
        <a href="#experience">Experience</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
      </div>
    </div>
  </nav>

  <main style="padding-top: 60px;">
    <!-- Sections will be built here -->
  </main>
</body>
