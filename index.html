/* ══════════════════════════════════════════════════════════════
   PHASE 1: MONOLITH NOIR - FOUNDATION & CSS ARCHITECTURE
   ══════════════════════════════════════════════════════════════ */
:root {
  /* Colors */
  --surface-base: #131313;
  --surface-container: #1C1B1B;
  --surface-bright: #3a3939;
  --accent-glare: #FF0000;
  --border-color: #393939;
  
  --text-primary: #e6e1e1;
  --text-secondary: #c4c7c7;
  --text-inverse: #313030;
  
  --glass-overlay: rgba(28, 27, 27, 0.8);
  
  /* Typography */
  --font-mono: 'Space Mono', monospace;
  --font-body: 'Inter', sans-serif;
  
  /* Layout */
  --grid-base: 4px;
  --radius: 0px; /* Strict Brutalism */
}

/* Reset & Base */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--surface-base);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* Typography Scale */
h1, h2, h3, h4, h5, h6, .mono-head {
  font-family: var(--font-mono);
  text-transform: uppercase;
  font-weight: 700;
}
.display-lg { font-size: clamp(32px, 5vw, 48px); line-height: 1.1; letter-spacing: -0.02em; }
.headline-lg { font-size: clamp(24px, 4vw, 32px); line-height: 1.2; letter-spacing: 0.05em; }
.headline-md { font-size: 24px; line-height: 1.2; letter-spacing: 0.05em; }
.headline-sm { font-size: 18px; line-height: 1.4; letter-spacing: 0.1em; }
.label-md { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; }

/* Brutalist Utilities */
a { color: inherit; text-decoration: none; }
ul { list-style: none; }
.sharp { border-radius: var(--radius) !important; }
.border-grid { border: 1px solid var(--border-color); }
</style>
</head>
